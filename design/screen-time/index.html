<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Aerial 屏幕时间</title>
<!--
  Prototype. Mock data, no server, every control live.
  Tokens, .list/.item/.switch/.sheet and the KEYS+TEXTS i18n shape mirror
  app/src/main/assets/web/index.html so this can merge in as a fourth tab.
  Production: flatten TEXT_TABLE into KEYS plus index-aligned arrays, add ru/uk/kk.
-->
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --label: #000; --secondary: rgba(60,60,67,.6); --tertiary: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18); --tint: #007aff; --fill: rgba(118,118,128,.12); --danger: #ff3b30;
    --ok: #34c759; --warn: #ff9f0a;
    --bar: rgba(249,249,249,.82); --bar-line: rgba(0,0,0,.14); --scrim: rgba(0,0,0,.32); --sheet: #f2f2f7;
    --ease-out: cubic-bezier(.23,1,.32,1); --ease-drawer: cubic-bezier(.32,.72,0,1);
    --tabbar: calc(50px + env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgba(235,235,245,.6); --tertiary: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6); --tint: #0a84ff; --fill: rgba(118,118,128,.24); --danger: #ff453a;
      --bar: rgba(22,22,22,.82); --bar-line: rgba(255,255,255,.12); --scrim: rgba(0,0,0,.5); --sheet: #1c1c1e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans", system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  main { max-width: 720px; margin: 0 auto; padding: env(safe-area-inset-top) 16px calc(var(--tabbar) + 32px); }
  main.selecting { padding-bottom: calc(var(--tabbar) + 104px); }
  header { padding: 28px 4px 4px; position: relative; }
  header h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  header p { margin: 3px 0 0; color: var(--secondary); font-size: 15px; display: flex; align-items: center; gap: 6px; }
  header .act { position: absolute; right: 0; top: 30px; font-size: 15px; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0; box-shadow: 0 0 0 0 rgba(52,199,89,.5); animation: live 2.4s infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(52,199,89,.45); } 70% { box-shadow: 0 0 0 6px rgba(52,199,89,0); } 100% { box-shadow: 0 0 0 0 rgba(52,199,89,0); } }

  h2 { font-size: 12px; font-weight: 400; color: var(--secondary); margin: 26px 16px 7px; text-transform: uppercase; letter-spacing: .05em; }
  .foot { color: var(--secondary); font-size: 13px; margin: 8px 16px 0; }
  section > .list:first-child, section > .card:first-child { margin-top: 14px; }

  .list { background: var(--card); border-radius: 12px; overflow: hidden; }
  .item {
    position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 11px 16px;
    border: 0; background: none; text-align: left; transition: background-color .2s ease;
  }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
  .item.hasicon + .item::before { left: 66px; }
  button.item:active, label.item:active { background: var(--fill); transition-duration: 0s; }
  .item .txt { flex: 1; min-width: 0; }
  .item .sub { display: block; font-size: 13px; color: var(--secondary); margin-top: 2px; }
  .item .val { color: var(--secondary); white-space: nowrap; font-size: 16px; }
  .item .chev { color: var(--tertiary); flex-shrink: 0; }
  .item.tint { color: var(--tint); }
  .item.danger { color: var(--danger); }
  .item .val, .item .pill { flex-shrink: 0; }
  .item.on { background: var(--fill); }
  .tick { color: var(--tint); flex-shrink: 0; opacity: 0; transform: scale(.8); transition: opacity .15s ease, transform .2s var(--ease-out); }
  [aria-checked="true"] .tick { opacity: 1; transform: none; }
  .switch {
    appearance: none; -webkit-appearance: none; position: relative; flex-shrink: 0; width: 51px; height: 31px; margin: 0;
    border-radius: 16px; background: var(--fill); cursor: pointer; transition: background-color .2s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .25s var(--ease-out);
  }
  .switch:checked { background: var(--ok); }
  .switch:checked::after { transform: translateX(20px); }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 14px; border: 0; border-radius: 12px;
    background: var(--tint); color: #fff; font-weight: 600; cursor: pointer; font-size: 17px;
    transition: transform .16s var(--ease-out), opacity .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .btn.plain { background: var(--card); color: var(--tint); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row .btn { flex: 1; }
  .link { appearance: none; border: 0; background: none; color: var(--tint); padding: 0; cursor: pointer; font-weight: 600; font-size: 17px; }
  .link.sm { font-size: 15px; font-weight: 500; }
  .empty { color: var(--secondary); font-size: 15px; padding: 16px; margin: 0; }

  /* Time card. */
  .card { background: var(--card); border-radius: 16px; padding: 18px; }
  .card + .card { margin-top: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 400; color: var(--secondary); text-transform: uppercase; letter-spacing: .05em; }
  .ringwrap { display: flex; align-items: center; gap: 18px; }
  .ringbox { position: relative; width: 116px; height: 116px; flex-shrink: 0; }
  .ring { width: 116px; height: 116px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
  .ring .bgc { stroke: var(--fill); }
  .ring .fgc { transition: stroke-dashoffset .7s var(--ease-out), stroke .3s ease; }
  .ringpct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 21px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .ringnum { flex: 1; min-width: 0; }
  .ringnum b { display: block; font-size: 25px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .ringnum b small { font-size: 15px; font-weight: 500; color: var(--secondary); margin-left: 3px; }
  .ringnum .of { display: block; color: var(--secondary); font-size: 14px; margin-top: 3px; }
  .state { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 14px; font-weight: 600; }
  .quick { display: flex; gap: 8px; margin-top: 18px; }
  .quick .btn { flex: 1; padding: 11px 0; font-size: 16px; border-radius: 11px; background: var(--fill); color: var(--tint); }

  .bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; margin-top: 7px; }
  .bar i { display: block; height: 100%; border-radius: 3px; transition: width .5s var(--ease-out); }
  .pill { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: var(--fill); color: var(--secondary); white-space: nowrap; }
  .pill.ok { background: rgba(52,199,89,.16); color: #248a3d; }
  .pill.warn { background: rgba(255,159,10,.18); color: #b25000; }
  .pill.over { background: rgba(255,59,48,.16); color: var(--danger); }
  @media (prefers-color-scheme: dark) { .pill.ok { color: #30d158; } .pill.warn { color: #ffa42a; } }

  .icon-sq { width: 38px; height: 38px; border-radius: 9px; color: #fff; display: grid; place-items: center; flex-shrink: 0; font-size: 16px; font-weight: 600; }
  .gicon { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0; color: #fff; font-weight: 700; font-size: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Chart. */
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 104px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
  .chart .stem { width: 100%; max-width: 24px; border-radius: 5px 5px 2px 2px; background: var(--fill); transition: height .5s var(--ease-out); }
  .chart .col.today .stem { background: var(--tint); }
  .chart .lab { font-size: 11px; color: var(--secondary); }
  .chart .col.today .lab { color: var(--tint); font-weight: 700; }

  /* Tabs. */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: var(--tabbar); padding-bottom: env(safe-area-inset-bottom);
    display: flex; justify-content: center; background: var(--bar); box-shadow: 0 -.5px 0 var(--bar-line);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  nav button {
    flex: 1; max-width: 160px; border: 0; background: none; padding: 6px 0 0; color: var(--secondary);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; cursor: pointer;
  }
  nav button svg { transition: transform .16s var(--ease-out); }
  nav button:active svg { transform: scale(.88); }
  nav button[aria-selected="true"] { color: var(--tint); }

  /* Chips, search, controls. */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 2px; margin: 0 -2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; border: 0; border-radius: 18px; padding: 7px 14px; background: var(--card); color: var(--secondary); font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color .2s ease, color .2s ease; }
  .chip[aria-pressed="true"] { background: var(--label); color: var(--bg); }
  .chip.wk { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; border-radius: 50%; font-size: 15px; }
  .chip:disabled { opacity: .35; }
  .swatch { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 0; cursor: pointer; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 10px; padding: 9px 11px; margin-top: 14px; color: var(--secondary); }
  .search input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--label); background: none; border: 0; outline: none; padding: 0; }
  .search input::placeholder { color: var(--tertiary); }
  .search .link { font-size: 15px; }
  input[type=time] { font: inherit; font-size: 17px; color: var(--tint); background: none; border: 0; outline: none; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=time]:disabled { color: var(--tertiary); }
  .field input { flex: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--label); background: none; border: 0; outline: none; padding: 0; }
  .stepper { display: flex; align-items: center; gap: 2px; background: var(--fill); border-radius: 9px; padding: 2px; flex-shrink: 0; }
  .stepper button { width: 32px; height: 28px; border: 0; border-radius: 7px; background: var(--card); color: var(--label); font-size: 17px; line-height: 1; cursor: pointer; }
  .stepper b { min-width: 44px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }
  .box { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; background: var(--fill); box-shadow: inset 0 0 0 1.5px var(--tertiary); display: grid; place-items: center; transition: background-color .15s ease, box-shadow .15s ease; }
  .box.on { background: var(--tint); box-shadow: none; }
  .box.on::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.2px 2.2px 0; transform: rotate(45deg) translate(-1px,-1px); }
  .tnum { font-variant-numeric: tabular-nums; }

  /* Free-form duration: hours and minutes, not a shelf of presets. */
  .dprev { text-align: center; font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 16px 0 0; font-variant-numeric: tabular-nums; }
  .dur { display: flex; justify-content: center; gap: 26px; margin: 12px 0 4px; }
  .dg { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .dg .r { display: flex; align-items: center; gap: 6px; }
  .dg .u { font-size: 13px; color: var(--secondary); }
  .dg input { width: 58px; text-align: center; font: inherit; font-size: 28px; font-weight: 700; color: var(--label);
    background: var(--fill); border: 0; border-radius: 11px; padding: 5px 0; font-variant-numeric: tabular-nums; }
  .dg input::-webkit-outer-spin-button, .dg input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .dg input { -moz-appearance: textfield; appearance: textfield; }
  .dg input:disabled { opacity: .3; }
  .dg input:focus { outline: 2px solid var(--tint); outline-offset: 1px; }
  .arrow { width: 38px; height: 38px; border: 0; border-radius: 11px; background: var(--fill); color: var(--tint);
    font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .arrow:active { background: var(--sep); transform: scale(.93); }
  .arrow[disabled] { opacity: .3; pointer-events: none; }

  /* Version bank (APK upgrades). Households read this page, so the copy is Chinese-first;
     nothing here loads a font, an icon set or a script from the network. */
  #vercards { display: flex; gap: 12px; align-items: stretch; margin-top: 14px; }
  #vercards .card { flex: 1; min-width: 0; }
  #vercards .card + .card { margin-top: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .verrow { align-items: flex-start; flex-wrap: wrap; padding: 13px 16px; }
  .verrow .txt { flex: 1 1 200px; }
  .verrow .fchip { width: 62px; text-align: center; margin-top: 2px; }
  .vermeta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; margin-top: 4px; font-size: 12.5px; color: var(--secondary); }
  .vacts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 9px; }
  .vacts .link.sm { font-size: 14px; }
  .link.dngr { color: var(--danger); }
  details.notes { margin-top: 7px; }
  details.notes > summary { font-size: 13px; color: var(--tint); cursor: pointer; list-style: none; }
  details.notes > summary::-webkit-details-marker { display: none; }
  details.notes > summary::before { content: "› "; display: inline-block; transition: transform .2s var(--ease-out); }
  details.notes[open] > summary::before { transform: rotate(90deg) translateX(-2px); }
  details.notes p { margin: 5px 0 0; font-size: 13px; color: var(--secondary); white-space: pre-wrap; }
  .verfail { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; padding: 10px 14px; border-radius: 12px;
    background: rgba(255,59,48,.1); color: var(--danger); font-size: 13px; }
  .verfail .link { margin-left: auto; font-size: 14px; white-space: nowrap; }

  /* Sheet. */
  .sheet-wrap { position: fixed; inset: 0; z-index: 20; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .2s ease; }
  .sheet {
    max-height: calc(100% - env(safe-area-inset-top) - 24px); overflow-y: auto; overscroll-behavior: contain;
    position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--sheet);
    border-radius: 14px 14px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .2s var(--ease-out);
  }
  .sheet-wrap.open .scrim { opacity: 1; transition-duration: .3s; }
  .sheet-wrap.open .sheet { transform: none; transition: transform .38s var(--ease-drawer); }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--tertiary); margin: 0 auto 12px; }
  .sheet h3 { text-align: center; font-size: 17px; font-weight: 600; margin: 4px 0 2px; }
  .sheet .meta { text-align: center; font-size: 13px; color: var(--secondary); margin: 2px 0 16px; }
  .sheet .list { background: var(--card); }
  @media (prefers-color-scheme: dark) { .sheet .list { background: #2c2c2e; } }
  .sheet .list + .list { margin-top: 10px; }
  .sheet h2 { margin-left: 4px; }
  .sheet .row { margin-top: 12px; }
  .sheet .foot { margin: 10px 4px 0; }
  .shead { display: flex; justify-content: center; margin-bottom: 8px; }

  /* Confirmation. This used to be window.confirm(), and browsers stop showing native dialogs
     after a few of them (Edge and Chrome both offer "prevent this page from creating additional
     dialogs"). Once that happened the button did nothing at all and said nothing — which is the
     "分组无法删除" report. The page's own dialog cannot be suppressed, and it also survives the
     phone's in-app browsers, where confirm() is sometimes swallowed. */
  .ask-wrap { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; }
  .ask-wrap[hidden] { display: none; }
  .ask {
    position: relative; width: 100%; max-width: 300px; background: var(--sheet); border-radius: 14px;
    padding: 20px 16px 14px; text-align: center; transform: scale(.94); opacity: 0;
    transition: transform .2s var(--ease-out), opacity .2s var(--ease-out);
  }
  .ask-wrap.open .scrim { opacity: 1; }
  .ask-wrap.open .ask { transform: none; opacity: 1; }
  .ask h3 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  .ask p { font-size: 13px; color: var(--secondary); margin: 0 0 16px; line-height: 1.45; white-space: pre-line; }
  .ask .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* PIN. */
  .pindots { display: flex; gap: 14px; justify-content: center; margin: 20px 0 4px; }
  .pindots i { width: 13px; height: 13px; border-radius: 50%; background: var(--fill); box-shadow: inset 0 0 0 1px var(--sep); transition: background-color .15s ease, transform .2s var(--ease-out); }
  .pindots i.on { background: var(--label); transform: scale(1.08); }
  .shake { animation: shake .34s ease; }
  @keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; margin: 20px auto 6px; }
  .keys button { height: 62px; border: 0; border-radius: 14px; background: var(--card); font-size: 27px; font-weight: 500; cursor: pointer; transition: transform .12s var(--ease-out), background-color .12s ease; }
  .keys button:active { transform: scale(.94); background: var(--fill); }
  .keys .fn { background: none; font-size: 15px; font-weight: 600; color: var(--tint); }
  .keys .fn:active { background: var(--fill); }

  /* Selection bar. */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; max-width: 520px; margin: 0 auto;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--bar); box-shadow: 0 -.5px 0 var(--bar-line);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); display: flex; gap: 12px; align-items: center;
    transform: translateY(110%); transition: transform .3s var(--ease-drawer);
  }
  .actionbar.on { transform: none; }
  .actionbar .n { flex: 1; font-size: 15px; color: var(--label); line-height: 1.3; }
  .actionbar .n small { display: block; font-size: 12px; color: var(--secondary); }
  .actionbar .btn { width: auto; flex: none; padding: 11px 16px; font-size: 15px; border-radius: 11px; }
  .actionbar .ghost { background: none; color: var(--secondary); padding: 11px 6px; }

  .toast {
    position: fixed; z-index: 30; left: 50%; bottom: calc(var(--tabbar) + 18px); transform: translate(-50%, 12px);
    background: rgba(30,30,30,.92); color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 15px; max-width: calc(100% - 32px);
    opacity: 0; transition: opacity .2s ease, transform .3s var(--ease-out); pointer-events: none;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (hover: hover) and (pointer: fine) {
    button.item:hover, label.item:hover { background: var(--fill); }
    .btn:hover { filter: brightness(1.06); }
    nav button:hover { color: var(--label); }
    .chip:hover { filter: brightness(1.05); }
  }
  @media (min-width: 900px) {
    :root { --side: 220px; }
    main { max-width: 1040px; margin: 0 0 0 var(--side); padding: 12px 40px 48px; }
    @media (min-width: 1320px) { main { margin-left: calc(var(--side) + (100vw - var(--side) - 1040px) / 2); } }
    header { padding-top: 32px; }
    nav { top: 0; right: auto; bottom: 0; width: var(--side); height: auto; padding: 88px 12px 0; flex-direction: column; justify-content: flex-start; gap: 4px; box-shadow: .5px 0 0 var(--bar-line); }
    nav button { flex: none; max-width: none; flex-direction: row; gap: 12px; padding: 9px 12px; border-radius: 10px; font-size: 15px; font-weight: 500; color: var(--label); }
    nav button svg { width: 22px; height: 22px; color: var(--secondary); }
    nav button[aria-selected="true"] { background: var(--fill); color: var(--tint); }
    nav button[aria-selected="true"] svg { color: var(--tint); }
    .sheet { top: 50%; bottom: auto; left: 50%; right: auto; width: 520px; max-height: calc(100% - 80px); border-radius: 14px; padding: 18px 20px 20px; transform: translate(-50%, -46%); opacity: 0; transition: transform .2s var(--ease-out), opacity .15s ease; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
    .sheet-wrap.open .sheet { transform: translate(-50%, -50%); opacity: 1; transition: transform .26s var(--ease-out), opacity .2s ease; }
    .grab { display: none; }
    .toast { bottom: 28px; left: calc(50% + var(--side) / 2); }
    .actionbar { left: var(--side); right: 0; max-width: 760px; }
    main.selecting { padding-bottom: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet-wrap.open .sheet, .actionbar { transition: none; }
    .toast { transform: translate(-50%, 0); }
    .live { animation: none; }
  }
</style>
</head>

const wrap = document.getElementById("wrap"), sheet = document.getElementById("sheet");
const CTX = { gid: null, pkg: null, pkgs: null, afterJoin: null, pickFn: null, afterNew: null, dur: null, durSync: null, durStop: null, relPick: null };
let sheetSeq = 0;
function openSheet(html) {
  sheetSeq++;

  CTX.afterJoin = CTX.pickFn = CTX.dur = CTX.durSync = CTX.durStop = CTX.relPick = null;
  sheet.innerHTML = '<div class="grab"></div>' + html;
  sheet.scrollTop = 0;
  wrap.hidden = false;
  const seq = sheetSeq;
  // A closeSheet() already queued in this frame has removed .open; without this guard its own rAF
  // would mark a hidden wrapper open and the sheet would never appear again.
  requestAnimationFrame(() => { if (seq === sheetSeq && !wrap.hidden) wrap.classList.add("open"); });
}
function closeSheet() {
  if (CTX.durStop) CTX.durStop();

  const seq = sheetSeq;
  wrap.classList.remove("open");
  setTimeout(() => {
    if (seq !== sheetSeq) return;
    wrap.hidden = true;
    wrap.classList.remove("open");

/* ==================================================================== ask */
/* One question, one answer: the page's own replacement for window.confirm(). Every destructive
   action goes through it (delete a group, clear usage, enable or drop a release). A native dialog
   that the browser has decided to suppress looks exactly like a dead button, and that is how
   "分组无法删除" came about: no request ever left the browser. */
let ASK = null;
const askwrap = document.getElementById("askwrap");
function ask(title, body, onYes, yesText) {
  ASK = onYes;
  document.getElementById("askTitle").textContent = title;
  document.getElementById("askBody").textContent = body;
  document.getElementById("askNo").textContent = t("cancel");
  document.getElementById("askYes").textContent = yesText || t("ok");

}

}

let PIN = { mode: "unlock", phase: "check", entry: "", first: "", after: null };
function openPin(mode, after) {
  PIN = { mode, phase: mode === "change" ? "old" : mode === "set" ? "new1" : "check", entry: "", first: "", after: after || null };
  drawPin();
}
function pinTitle() {
  return PIN.phase === "check" || PIN.phase === "old" ? { h: t("pin_title"), m: t(PIN.phase === "old" ? "pin_old" : "pin_hint") }
    : PIN.phase === "new1" ? { h: t("pin_new"), m: t("pin_new") } : { h: t("pin_again"), m: t("pin_again") };
}
function drawPin() {
  const { h, m } = pinTitle();
  openSheet(`<h3>${esc(h)}</h3><p class="meta">${esc(m)}</p>
    <div class="pindots" id="pdots"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="pkeys">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-pin="${n}">${n}</button>`).join("")}
      <button class="fn" data-pin="cancel">${esc(t("cancel"))}</button><button data-pin="0">0</button>
      <button class="fn" data-pin="del">⌫</button></div>`);
  paint();
  document.getElementById("pkeys").addEventListener("click", e => {
    const b = e.target.closest("[data-pin]"); if (!b) return;
    const v = b.dataset.pin;
    if (v === "cancel") { PIN.after = null; closeSheet(); render(); return; }
    if (v === "del") { PIN.entry = PIN.entry.slice(0, -1); return paint(); }
    if (PIN.entry.length >= 4) return;
    PIN.entry += v; paint();
    if (PIN.entry.length === 4) setTimeout(pinAdvance, 170);
  });
  function paint() { document.querySelectorAll("#pdots i").forEach((d, i) => d.classList.toggle("on", i < PIN.entry.length)); }
  function bad(msg) {
    const d = document.getElementById("pdots");
    d.classList.add("shake"); toast(msg);
    setTimeout(() => { d?.classList.remove("shake"); }, 380);
    PIN.entry = ""; setTimeout(paint, 200);
  }
  function grant() { M.pin.locked = false; M.pin.until = Date.now() + 600000; closeSheet(); render(); toast(t("unlocked_left", { t: fmtLeft(600000) })); if (PIN.after) { const f = PIN.after; PIN.after = null; f(); } }
  function pinAdvance() {
    const e = PIN.entry;
    const toNew1 = () => {
      PIN.phase = "new1"; PIN.entry = ""; paint();
      sheet.querySelector("h3").textContent = t("pin_new");
      sheet.querySelector(".meta").textContent = t("pin_new");
    };
    // "check" gates every write, "old" gates a PIN change: both must ask the server, never a value in the page.
    if (PIN.phase === "check" || PIN.phase === "old") {
      return verifyPin(e, PIN.phase === "check" ? grant : toNew1, () => bad(t("pin_wrong")));
    }
    if (PIN.phase === "new1") { PIN.first = e; PIN.phase = "new2"; PIN.entry = ""; paint(); sheet.querySelector("h3").textContent = t("pin_again"); sheet.querySelector(".meta").textContent = t("pin_again"); return; }
    if (e !== PIN.first) { PIN.phase = "new1"; PIN.first = ""; bad(t("pin_mismatch")); return; }
    // The PIN save bypasses send(): the session is still locked until this very write succeeds.
    const saved = () => { M.pin.locked = false; M.pin.until = now() + 600000; toast(t("pin_saved")); closeSheet(); render(); };
    const r = api("stime/pin", { code: e });
    if (isAsync(r)) r.then(saved, () => {}); else saved();
  }
}

  if (!unlocked()) return openPin("unlock");

  const h = Math.round(m / 60);
  return h < 24 ? t("ago_hour", { n: h }) : t("ago_day", { n: Math.round(h / 24) });
}

/* ============================================================ version bank
   The tab reads GET /api/stime/releases (§6.3) and writes through the page's one
   api() shape, so a locked session replays the click after the PIN goes in — the
   same path every other write here takes. A backend that will not answer never
   empties the list: the last loaded rows stay on screen with a visible complaint. */
const FLAVORS = ["standard", "guard"];
const fmtSize = b => { const n = Number(b); if (!isFinite(n) || n <= 0) return "—";
  return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024) + " KB" : n + " B"; };
const fmtDate = ts => { const n = Number(ts); if (!isFinite(n) || n <= 0) return "—";
  const d = new Date(n), p = x => String(x).padStart(2, "0");
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); };
const verLabel = r => !r ? "—" : (r.versionName || "?") + "(" + (r.versionCode == null ? "?" : r.versionCode) + ")";
const flavorName = f => f === "standard" || f === "guard" ? t("flavor_" + f) : String(f || "—");
/* Missing fields happen on builds that never reported a version: show 未知, never throw. */
const devVerLine = d => {
  const v = d.appVersion || (d.versionCode == null ? "" : String(d.versionCode));
  return v ? v + (d.flavor ? " · " + d.flavor : "") : t("dev_unknown");
};

  ],

};
const relOf = id => R.releases.find(x => x.id === id) || null;
const inForce = r => !!r && R.current[r.flavor] === r.id;

function loadReleases(quiet) {
  if (!LIVE) { R.loaded = true; R.failed = ""; if (S.tab === "versions") render(); return Promise.resolve(true); }
  if (R.loading) return R.loading;
  R.attempted = true;
  R.loading = fetch(apiUrl("stime/releases") + (GRANT ? "?grant=" + encodeURIComponent(GRANT) : ""), { headers: { Accept: "application/json" } })
    // The backend says what went wrong in Chinese; pass that sentence through, never a bare code.
    .then(r => r.json().catch(() => ({})).then(b => {
      if (r.ok && b && Array.isArray(b.releases)) return b;
      throw new Error((b && b.error) || "http " + r.status);
    }))
    .then(b => {
      R.current = b.current || {}; R.releases = b.releases; R.devices = Array.isArray(b.devices) ? b.devices : [];
      R.loaded = true; R.failed = ""; R.needPin = false; R.loading = false;
      if (S.tab === "versions") render();
      return true;
    }, e => {
      R.loading = false;
      // 401 "locked" is not a broken backend: this one endpoint needs the parent session while the
      // rest of the page reads fine, and calling it "the backend did not answer" sent the owner
      // looking for a fault that was never there (户主, 2026-10-31).
      R.needPin = /locked/i.test((e && e.message) || "");
      R.failed = R.needPin ? "" : ((e && e.message) || "error");
      if (!quiet && !R.needPin) toast(t("ver_fail"));
      if (S.tab === "versions") render();
      return false;
    });
  return R.loading;
}

/* Offline demo only: the same four writes, applied to the mock bank. */
function mockRel(path, b) {
  const r = relOf(b && b.id); if (!r) return {};
  if (path === "stime/release/enable") {
    R.releases.forEach(x => { if (x.flavor === r.flavor) x.enabled = x.id === r.id; });
    R.current[r.flavor] = r.id;
  } else if (path === "stime/release/disable") {
    r.enabled = false;
    if (R.current[r.flavor] === r.id) R.current[r.flavor] = null;
  } else if (path === "stime/release/target") {
    r.devices = String(b.devices || "").split(",").filter(Boolean);
  } else if (path === "stime/release/del") {
    R.releases = R.releases.filter(x => x.id !== r.id);
    if (R.current[r.flavor] === r.id) R.current[r.flavor] = null;
  }
  return {};
}

/* api() carries the grant, the form body and the needPin toast; openPin replays the click
   afterwards, exactly like updGroup(). The extra argument hands the server's own fields
   (fileNote on delete) back to the caller, which is the only thing send() could not carry. */
function relWrite(path, body, msg, after) {
  const go = () => {
    const done = st => loadReleases(true).then(() => {
      render();
      if (after) after(st || {}); else toast(typeof msg === "function" ? msg(st || {}) : msg);
      return true;
    });
    if (!LIVE) return done(mockRel(path, body));
    const r = api(path, body);
    return isAsync(r) ? r.then(done, () => false) : done(r);
  };
  if (!unlocked()) { openPin("unlock", go); return false; }
  return go();
}

function limitSheet(title, cur, after) {
  const d = cur === null ? { on: true, h: 1, m: 0 } : { on: false, h: Math.min(23, Math.floor(cur / 60)), m: cur % 60 };
  const col = (id, unit, max) => `<div class="dg"><div class="r">
      <button class="arrow" data-d="${id}:-1" aria-label="-1 ${esc(unit)}">−</button>
      <input id="${id}" type="number" inputmode="numeric" min="0" max="${max}" value="${id === "dh" ? d.h : d.m}" aria-label="${esc(unit)}">
      <button class="arrow" data-d="${id}:1" aria-label="+1 ${esc(unit)}">＋</button>
    </div><span class="u">${esc(unit)}</span></div>`;
  openSheet(`<h3>${esc(title)}</h3><p class="dprev" id="dprev"></p>
    <div class="dur">${col("dh", t("unit_hours"), 23)}${col("dm", t("unit_minutes"), 59)}</div>
    <div class="list" style="margin-top:14px"><label class="item">
      <span class="txt">${esc(t("unlimited_switch"))}</span><input class="switch" type="checkbox" data-on="dunlim" ${d.on ? "checked" : ""}></label></div>
    <div class="row"><button class="btn" data-act="dsave">${esc(t("save"))}</button></div>
    <p class="foot">${esc(t("limit_foot"))}</p>`);
  CTX.dur = d; CTX.pickFn = after;
  const clamp = v => parseInt(v, 10);
  const sync = (which) => {
    const ih = document.getElementById("dh"), im = document.getElementById("dm");
    if (!ih || !im) { stopHold(); return; }
    if (which === "in") { d.h = Math.max(0, Math.min(23, clamp(ih.value) || 0)); d.m = Math.max(0, Math.min(59, clamp(im.value) || 0)); }
    else { ih.value = d.h; im.value = d.m; }
    [ih, im].forEach(el => { el.disabled = d.on; });
    sheet.querySelectorAll(".arrow").forEach(b => {
      const [k, sign] = b.dataset.d.split(":"), val = k === "dh" ? d.h : d.m;
      b.disabled = d.on || (sign === "-1" && val <= 0) || (sign === "1" && (k === "dh" ? val >= 23 : val >= 59));
    });
    const tot = d.h * 60 + d.m, prev = document.getElementById("dprev");
    prev.textContent = d.on ? t("g_unlimited") : tot === 0 ? t("dur_zero") : fmtLimit(tot);
    prev.style.color = !d.on && tot === 0 ? "var(--warn)" : "";
  };
  let holdTo, holdIv;
  const stopHold = () => { clearTimeout(holdTo); clearInterval(holdIv); holdTo = holdIv = null; };
  CTX.durSync = sync; CTX.durStop = stopHold;
  sync();
  // Hold to run: 23 hours is a long way to tap one step at a time.
  sheet.querySelector(".dur").addEventListener("pointerdown", e => {
    const b = e.target.closest(".arrow"); if (!b || b.disabled) return;
    e.preventDefault();
    stopHold();
    const step = () => { const [k, sign] = b.dataset.d.split(":"), s = +sign * (k === "dh" ? 1 : 5);
      if (k === "dh") d.h = Math.max(0, Math.min(23, d.h + s)); else d.m = Math.max(0, Math.min(59, d.m + s)); sync(); };
    const release = () => { stopHold(); b.removeEventListener("pointerup", release); b.removeEventListener("pointercancel", release); };
    step();
    if (b.disabled) release();                       // held into the edge: stop running
    else holdTo = setTimeout(() => { holdIv = setInterval(() => { step(); if (b.disabled) release(); }, 90); }, 340);
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, release, { once: true }));
  });
  ["dh", "dm"].forEach(id => document.getElementById(id).addEventListener("input", () => sync("in")));
  ["dh", "dm"].forEach(id => document.getElementById(id).addEventListener("blur", () => sync()));
}

function renderBar() {
  const bar = document.getElementById("actionbar");
  if (!S.selecting) { bar.className = "actionbar"; bar.hidden = true; return; }
  if (bar.dataset.n === String(S.picked.size) && bar.dataset.t === String(CTX.afterNew)) return;
  const n = S.picked.size, cross = [...S.picked].filter(p => gidOf(p)).length;
  const target = CTX.afterNew;
  bar.hidden = false;
  bar.dataset.n = String(n); bar.dataset.t = String(target);
  bar.className = "actionbar" + (n ? " on" : "");
  bar.innerHTML = `<span class="n">${esc(t("selected_n", { n }))}${cross && !target ? `<small>${esc(t("selected_move", { n: cross }))}</small>` : ""}</span>
    ${target ? `<button class="btn" data-bar="here" ${n ? "" : "disabled"}>${esc(t("group_add_app"))}</button>` : ""}
    <button class="btn" data-bar="join" ${n ? "" : "disabled"}>${esc(t("join_group"))}</button>
    <button class="btn ghost" data-bar="cancel">${esc(t("cancel"))}</button>`;
  bar.onclick = e => {
    const b = e.target.closest("[data-bar]"); if (!b) return;
    const pkgs = [...S.picked];
    if (b.dataset.bar === "cancel" || !pkgs.length) { S.selecting = false; S.picked.clear(); CTX.afterNew = null; render(); return; }
    if (b.dataset.bar === "here") {
      const toGroup = target;
      const go = () => {
        S.selecting = false; S.picked.clear(); CTX.afterNew = null;
        closeSheet();                     // before send(): an expired PIN opens its sheet here
        send("stime/group/members", { id: toGroup, pkgs: pkgs.join(","), mode: "move" }, () => t("joined_ok", { n: pkgs.length, name: gname(grp(toGroup)) }));
        groupSheet(toGroup);              // reopened at once, so the close above still animates once
      };
      // Ask for the PIN up front: send() only replays itself after unlocking, so the rest of this
      // flow (leaving selection, closing sheets, opening the group) would be skipped.
      if (!unlocked()) return openPin("unlock", go);
      go(); return;
    }
    joinSheet(pkgs, gid => {
      S.selecting = false; S.picked.clear(); CTX.afterNew = null;
      closeSheet();
      send("stime/group/members", { id: gid, pkgs: pkgs.join(","), mode: "move" }, () => t("joined_ok", { n: pkgs.length, name: gname(grp(gid)) }));
    });
  };
}

/* ==================================================================== boot + live */
const startTab = (location.hash || "").slice(1);
const bootTab = TABS.includes(startTab) ? startTab : (localStorage.getItem("aerial-stime-tab") || "today");
fetchState()
  .then(st => {
    hydrate(st);
    // First open: there was no stored client, so the answer may be the server's fallback rather
    // than defaultDeviceId. Ask once more, now that DEV is settled, before the first paint.
    return st.device && st.device.id !== curId() ? fetchState().then(hydrate, () => null) : st;
  }, seedDemoFromUrl)
  .then(() => show(bootTab), () => show(bootTab));
setInterval(refresh, 15000);
setInterval(() => {
  if (document.hidden) return;
  if (!LIVE && M.current.pkg) M.byApp[M.current.pkg] = (M.byApp[M.current.pkg] || 0) + 1000;
  const el = document.getElementById("curin");
  if (el) el.textContent = fmtDur(now() - M.current.since);
  if (S.tab !== "today" || !wrap.hidden) return;
  const { used, cap, p, color } = todayFigures(), C = 2 * Math.PI * 52, ring = document.getElementById("gring");
  if (ring) { ring.style.strokeDashoffset = (C * (1 - p)).toFixed(1); ring.style.stroke = color; }
  const pct = document.getElementById("gpct");
  if (pct) { pct.textContent = cap ? Math.round(p * 100) + "%" : "∞"; pct.style.color = color; }
  const gd = document.getElementById("gused");
  if (gd) gd.innerHTML = esc(fmtDur(used)) + ` <small>${esc(t("used_suffix"))}</small>`;
  const st = document.getElementById("gstate");
  if (st) st.innerHTML = todayFigures().stateHtml;
  document.querySelectorAll("#grouplist .bar i").forEach((b, i) => {
    const g = M.groups[i]; if (!g) return;
    const u = gUsed(g), pr = g.dailyMinutes == null ? pctOf(u, 3 * HOUR) : pctOf(u, g.dailyMinutes * MIN);
    b.style.width = (pr * 100).toFixed(1) + "%";
    b.style.background = g.blocked || (g.dailyMinutes != null && pr >= 1) ? "var(--danger)" : g.dailyMinutes != null && pr >= .85 ? "var(--warn)" : g.color;
  });
}, 1000);
setInterval(() => { if (!document.hidden && !M.pin.locked && grantLeft() <= 0) { M.pin.locked = true; render(); toast(t("locked_ok")); } }, 15000);
</script>
